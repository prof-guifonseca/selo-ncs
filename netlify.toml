[build]
  publish = "dist"
  command = "node build.js && node scripts/smoke.mjs"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/telemetry"
  to = "/.netlify/functions/telemetry"
  status = 200
  force = true


[[redirects]]
  from = "/api/report"
  to = "/.netlify/functions/report"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; manifest-src 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[redirects]]
  from = "/public"
  to = "/public.html"
  status = 200

[[redirects]]
  from = "/public/*"
  to = "/public.html"
  status = 200

[[redirects]]
  # SPA fallback: serve index.html for all non‑API, non‑public routes.
  # Esta regra garante que rotas da SPA baseadas em History API (pushState)
  # funcionem corretamente no Netlify.  Ela deve ficar **após** as regras
  # específicas de /api e /public para não interferir no backend nem nas
  # páginas públicas.
  from = "/*"
  to = "/index.html"
  status = 200
