name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug workspace
        run: |
          pwd
          ls -la
          echo "---- lockfiles ----"
          ls -la package-lock.json || true
          echo "---- git ----"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Assert lockfile exists
        run: test -f package-lock.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 🔥 chave: garante ambiente limpo
      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci

      - name: Run CI (official gates)
        run: npm run ci

      # --------------------------------------------------
      # Playwright E2E
      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Run E2E tests
        run: |
          npm run e2e --silent 2>&1 | tee docs/evidencias/E2E_AUTOMATED_RESULT.txt

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/**
            playwright-report/**
            docs/evidencias/E2E_AUTOMATED_RESULT.txt
          retention-days: 5
